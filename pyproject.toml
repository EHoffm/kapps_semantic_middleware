[project]
name = "kapps-semantic-middleware"
version = "0.1.0"
description = "Semantic middleware for industrial data integration, built on aas-middleware"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kapps-ogm>=0.1.2",
    "graph-db-interface>=2.0.1",
    "aas-middleware>=0.2.6",
    "httpx>=0.27.0",
    # aas_middleware keeps aiomqtt in an optional "industrial" extra, but the MQTT semantic
    # connector is a first-class part of this middleware (#40), so it is a plain dependency
    # here. Declaring it is also what stops the OGM repo's #15 failure -- importing a module
    # the manifest never mentions -- from recurring.
    "aiomqtt>=2.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.15",
    "rdflib>=7.1.3",
    "jupyter>=1.1.1",
    "nbconvert>=7.16.0",
    "jupytext>=1.16.0",
    "httpx>=0.27.0",
    # A pure-Python MQTT broker, run in-process as a pytest fixture. mosquitto would need
    # root to install, which no CI runner and no fresh checkout can assume; this keeps the
    # MockTransferUnit round-trip genuinely live and portable (#40).
    "amqtt>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kapps_semantic_middleware"]

[tool.uv.sources]
aas-middleware = { path = "../aas_middleware_inf", editable = true }
kapps-ogm = { path = "../kapps_ogm", editable = true }
graph-db-interface = { path = "../graph_db_interface", editable = true }

[tool.uv]
# kapps_ogm's Poetry manifest pins graph_db_interface to a git branch (SAWeindel/kapps_ogm#22,
# a temporary dev pin for the unreleased triples_update fix). uv sees that git URL and this
# project's editable path source as conflicting URLs for one package and refuses to resolve.
# The two are the same commit; the editable checkout is the one we develop against.
override-dependencies = ["graph-db-interface"]
