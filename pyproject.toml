[project]
name = "kapps-semantic-middleware"
version = "0.1.0"
description = "Semantic middleware for industrial data integration, built on aas-middleware"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kapps-ogm>=0.1.2",
    "aas-middleware>=0.2.6",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kapps_semantic_middleware"]

[tool.uv.sources]
aas-middleware = { path = "../aas_middleware_inf", editable = true }
