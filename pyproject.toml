[project]
name = "kapps-semantic-middleware"
version = "0.1.0"
description = "Semantic middleware for industrial data integration, built on aas-middleware"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kapps-ogm>=0.1.2",
    "graph-db-interface>=2.0.1",
    "aas-middleware>=0.2.6",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.15",
    "rdflib>=7.1.3",
    "jupyter>=1.1.1",
    "nbconvert>=7.16.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kapps_semantic_middleware"]

[tool.uv.sources]
aas-middleware = { path = "../aas_middleware_inf", editable = true }
kapps-ogm = { path = "../kapps_ogm", editable = true }
graph-db-interface = { path = "../graph_db_interface", editable = true }
