# The sibling checkouts this project is known to work against.
#
# `uv.lock` CANNOT record this. Root ADR 0001 wires the three siblings as editable *path*
# dependencies, and uv locks such a dependency as `source = { editable = "../name" }` -- a path,
# with no revision. So the lockfile pins the *location* of each sibling and nothing about its
# content. Whatever commit happens to be checked out there is what gets imported.
#
# That is why a fresh machine does not reproduce a working demo: every sibling below is on an
# unmerged branch, and a `main` checkout of any of them fails differently.
#
# **All three now carry the same branch name, `dev_semantic_middleware`** (2026-08-09). Each one
# points at exactly the commit this project is known to run against, so setting a machine up is
# the same command three times instead of three different feature-branch names to look up. The
# feature branches they came from still exist and are unchanged; this is a stable name in front
# of them, not a replacement.
#
# Verify a machine with:  python scripts/check_siblings.py
# Set one up with:        see SIBLINGS.md

[kapps_triplestore_interface]
path = "../kapps_triplestore_interface"
url = "git@gitlab.kit.edu:kit/ifl/opensource/circular_factory/inf/semantic_middleware_dev/kapps_triplestore_interface.git"
remote = "origin"
branch = "dev_semantic_middleware"
commit = "9c7c303"
why = """
Blank-node identity in `triples_update`. The pre-fork 2.0.1 mints a fresh blank node per
serialization, which orphans a parameter's connection metadata, and rejects a host:port form in
`mint_service_iri`. Root ADR 0003 (anonymous node identity is specified, not patched) is the
record.

**This entry replaces `graph_db_interface`, which no longer exists as a sibling.** #133 forked
`JaFeKl/graph_db_interface`, renamed it to `kapps_triplestore_interface` and gave it a home on
private KIT GitLab. Two lines that used to be here are gone with it: the branch is no longer on
a personal fork that a clone of origin cannot see, and there is no second remote to add. Access
to the GitLab group is now required -- the same position `aas_middleware_inf` has always been in.

The rename is applied in the dev tree rather than at release time (unlike the sibling fork), so
this commit is what both consumers import: `kapps_semantic_middleware` and `kapps_ogm` were both
swept in the same change, because a half-swept tree does not import.

Moved from c096ba6 to 9c7c303 for the code review's findings. **No package code changed**
(`git diff c096ba6..9c7c303 -- kapps_triplestore_interface/` is empty); what moved is the build
backend, from poetry-core to hatchling, because poetry-core writes only the first entry of
`authors` into a wheel and so credited one of the library's four authors. The manifest is PEP
621 now, and `poetry.lock` is gone with it.

> The GitLab group `semantic_middleware_dev` is expected to be renamed to `KAPPS_Dev`. The URL
> above and the one below move together when it happens.
"""

[kapps_ogm]
path = "../kapps_ogm"
url = "https://github.com/SAWeindel/kapps_ogm.git"
remote = "origin"
branch = "dev_semantic_middleware"
commit = "eec5297"
why = """
Conjunctive `rdfs:range`. `main` (0.1.2) raises on a class with several declared ranges, which
blocks both additive extension of the fixed `tu:` properties and ranges on the interface
superproperties -- the seed step fails on `isOccupied`. Root ADR 0002 records this as a kapps_ogm
defect; this branch is the fix.

Moved from e447562 to eec5297 for #133, which swept this repo's imports onto the triplestore
interface's released name. **No behaviour changed** -- `GraphDB`, `GraphDBCredentials` and
`use_gdb_token` all keep their names, so only the import path moved. The manifest did change,
and it is the reason the pin could not simply be left behind: its git-branch pin on the old
library is gone, replaced by `kapps-triplestore-interface >= 2.1.0`. That is what unblocks
#119 -- PyPI rejects a distribution whose metadata carries a direct URL -- and it is what let
this project's `[tool.uv] override-dependencies` hack die a ticket early.
"""

[aas_middleware_inf]
path = "../aas_middleware_inf"
url = "git@gitlab.kit.edu:kit/ifl/opensource/circular_factory/inf/semantic_middleware_dev/aas_middleware_inf.git"
remote = "origin"
branch = "dev_semantic_middleware"
commit = "8dc7291"
why = """
Three fixes made under root ADR 0001's bugfix allowance, all recorded in that repo's CHANGELOG:
#92 (a persistence-write notification was formatted before it was narrowed, and a read could echo
back out its own write leg), #94 (a write now names the field that moved, so an untouched
parameter is not commanded -- ADR 0035) and #103 (the package declares the httpx it imports at
module level). Without the first two the demo's northbound sync and its ramping belts are both
broken; the third changes no behaviour and makes the manifest honest. Private GitLab: access is
required, there is no public mirror.

Moved from b0d7440 to 999ef52 for #118, which added that repo's release mechanism under
`scripts/` and `tests_release/`. **No package code changed**, so nothing this project imports
moved -- the pin advances only so `check_siblings.py` stops reporting the checkout as dirty.
The rename to `transitional_sync_middleware` is applied at release time to a staged tree and is
NOT in this commit; the import name here stays `aas_middleware` until #120 does the sweep.

Moved again from 999ef52 to 8dc7291 for #152. #118 kept committing to the branch after recording
its pin, and the ticket that would have noticed was already closed. The gap is one commit --
`RELEASE.md` and a `scripts/release_allowlist.py` tweak, both of them that repo's own release
machinery. **No package code changed** here either (`git diff 999ef52..8dc7291 -- aas_middleware/`
is empty), so this is again a pin catching up with a branch rather than a version this project
runs differently against.
"""
